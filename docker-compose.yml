services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: history
      POSTGRES_PASSWORD: history
      POSTGRES_DB: history
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U history -d history"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - history-pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: history
      MINIO_ROOT_PASSWORD: history123
    ports:
      - "9000:9000"
      - "9001:9001"
    profiles: ["object-storage"]
    volumes:
      - history-minio:/data

volumes:
  history-pg:
  history-minio:
